version: "3.9"

services:
  db:
    image: postgres:16
    container_name: barn-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: barn_user
      POSTGRES_PASSWORD: barn_pass
      POSTGRES_DB: barn_dispatch
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: barn-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  db_data:
